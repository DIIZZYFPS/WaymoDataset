services:
  waymo-e2e-loader:
    build: .
    volumes:
      - ./waymo_dataset/results:/waymo_dataset/results
      - ./creds.json:/app/creds.json
    environment:
      - RESULTS_DIR=/waymo_dataset/results
      - REDIS_URL=redis://redis-server:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds.json
    working_dir: /app
    depends_on:
      - redis-server

  redis-server:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis-server:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis-server